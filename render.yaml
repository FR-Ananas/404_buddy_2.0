services:
  - type: web
    name: aeglane
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true   # Render génère une valeur aléatoire automatiquement
    # Pas de disk → SQLite éphémère (données reset à chaque redéploiement)
    # Passer au plan Starter ($7/mois) + décommenter ci-dessous pour la persistence :
    # disk:
    #   name: 404buddy-data
    #   mountPath: /var/data
    #   sizeGB: 1
